# Lattice: single-node minimal etcd Linux smoke graph (Phase 3).
#
# Brings up enough for etcd_edge_anchor → kv_request_router →
# kv_state_worker → kv_request_router → etcd_edge_anchor round-trip
# to function end-to-end on the host fluxor-linux runtime.
#
#   foundation/linux_net    TCP (port 2379 — etcd default)
#   etcd_edge_anchor        HTTP/2 + HPACK + gRPC etcdserverpb.KV
#   kv_request_router       envelope translation + per-corr_id inflight
#   kv_state_worker         deterministic in-memory KV
#
# Working commands against a real etcd v3 client:
#   client.put(k, v)         → routed → worker → PutResponse{revision}
#   client.get(k)            → routed → worker → RangeResponse{kvs[0]}
#   client.delete(k)         → routed → worker → DeleteRangeResponse{deleted}
#   Watch / Lease            → Phase 4 (anchor returns UNIMPLEMENTED)
#
# Run: `fluxor run configs/single-minimal-etcd.yaml`

target: linux
tick_us: 1000

# `platform.net = {}` activates the linux board's host net provider.
# `linux_net` is auto-injected by fluxor when wiring references it.
platform:
  net: {}

# anchor ↔ router and router ↔ worker form bidirectional pairs; the
# scheduler's cycle-rejection guard wants us to acknowledge that.
scheduler:
  accept_cycles: true

modules:
  - name: etcd_edge_anchor
  - name: kv_request_router
  - name: kv_state_worker

wiring:
  # ── TCP transport ───────────────────────────────────────────────
  - from: linux_net.net_out
    to: etcd_edge_anchor.net_in
  - from: etcd_edge_anchor.net_out
    to: linux_net.net_in

  # ── Anchor ↔ router (ingress + response) ───────────────────────
  - from: etcd_edge_anchor.kv_out
    to: kv_request_router.etcd_in
  - from: kv_request_router.etcd_out
    to: etcd_edge_anchor.routed_in

  # ── Router ↔ worker (command + applied) ────────────────────────
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
