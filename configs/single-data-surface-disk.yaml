# Lattice: the separated STORAGE graph, DISK-backed (RFC §14.10, §9.5).
#
# `single-data-surface.yaml` with the one semantic KV worker on the
# ordered DISK provider (`state_store: 1`) instead of the RAM table. The
# disk provider is the only one that RETAINS versions, so it is the one
# a record change feed (`DataOp::FeedRead` → `KV_OP_SCAN_VERSIONS`) can
# read history from — the memory provider is honestly history-free and
# answers a version window empty/compacted.
#
# Non-replicated: direct apply, no Clustor consensus. The feed reads the
# worker's own retained versions. `tests/live_data_surface.rs` drives it.

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: lattice_data_anchor
    params:
      listen_port: 7432
  - name: kv_request_router
  - name: kv_state_worker
    params:
      state_store: 1
      root_path: 0
      store_id: 0

wiring:
  - from: linux_net.net_out
    to: lattice_data_anchor.net_in
  - from: lattice_data_anchor.net_out
    to: linux_net.net_in

  - from: lattice_data_anchor.kv_out
    to: kv_request_router.internal_data_in
  - from: kv_request_router.compute_out
    to: lattice_data_anchor.kv_in

  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
