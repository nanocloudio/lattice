# Lattice: single-node DURABLE relational graph (RFC database
# foundation §6.3's durable database composition, carrying the §14.1
# relational front).
#
# `single-relational.yaml` proves the SQL path; this composition gives
# it the durability story every other write in the system has. The
# front half is identical — pg_edge_anchor (5432), mysql_edge_anchor
# (3306), ONE relational_executor, one catalog — and the back half is
# `single-replicated-disk.yaml`'s: every SQL write leaves the router as
# a proposal, acquires quorum durability in Clustor's WAL, and
# materializes through the apply bridge into the ORDERED DISK
# state-store (state_store: 1). A `CREATE TABLE` here survives a crash
# by exactly the mechanism a Redis `SET` does, which is the point of
# §14.1's "client of the canonical KV API": one durability story, not
# two.
#
# What this buys over the memory composition:
#   - the 1024-key in-memory ceiling is gone (rows live in the LSM),
#   - history is retained (MVCC over the disk provider),
#   - a kill -9 and restart replays the WAL and serves the same tables.
#
# The router classifies by op, not by protocol: SQL PUT/DELETE ride
# consensus, RANGE_SCAN/GET take the direct read path. That fell out of
# the existing `op_is_write` classification with no relational special
# case, which is the §14.1 split earning its keep.
#
# Run: mkdir -p wal kv && fluxor run configs/single-relational-disk.yaml
# Then: `psql    -h 127.0.0.1 -p 5432 -U lattice -d lattice`
#   or: `mariadb -h 127.0.0.1 -P 3306 -u lattice --skip-ssl`

target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

module_search_paths:
  - ../deps/clustor/modules/app
  - ./modules/app

modules:
  # ── Relational front (identical to single-relational.yaml) ──────
  - name: pg_edge_anchor
    params:
      listen_port: 5432
  - name: mysql_edge_anchor
    params:
      listen_port: 3306
  - name: relational_executor
  - name: backup_coordinator
    params:
      mode: 2
      backup_id: 7
      start_delay_ms: 20000
  - name: index_backfill

  # ── Lattice KV core ─────────────────────────────────────────────
  - name: kv_request_router
    params:
      lin_reads: 0
      # Refuse to start if proposal_out is unwired — a relational write
      # that silently skipped consensus would look durable and not be.
      replicated: 1
  - name: kv_state_worker
    params:
      # Ordered disk state-store provider: committed mutations
      # materialize into memtables + immutable sorted runs under `kv/`.
      state_store: 1
      root_path: 0
  - name: lattice_apply_bridge

  # ── Clustor client-proposal pipeline ────────────────────────────
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: gateway
    params:
      self_id: 0
  - name: admission
  - name: control_plane
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      segment_bytes: 262144
      self_id: 0
      voter_count: 1
      partition_id: 0

  # ── Observability: metric fan-in + HTTP /metrics ────────────────
  - name: adapter_metrics
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090

wiring:
  # ── TCP transport ───────────────────────────────────────────────
  - from: linux_net.net_out
    to: pg_edge_anchor.net_in
  - from: pg_edge_anchor.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: mysql_edge_anchor.net_in
  - from: mysql_edge_anchor.net_out
    to: linux_net.net_in

  # ── Connector ↔ executor ────────────────────────────────────────
  - from: pg_edge_anchor.sql_out
    to: relational_executor.pg_in
  - from: relational_executor.pg_out
    to: pg_edge_anchor.sql_in
  - from: mysql_edge_anchor.sql_out
    to: relational_executor.mysql_in
  - from: relational_executor.mysql_out
    to: mysql_edge_anchor.sql_in

  # ── Backfill worker ↔ router (PROTO_INTERNAL_JOB pair) ─────────
  - from: index_backfill.kv_out
    to: kv_request_router.internal_job_in
  - from: kv_request_router.internal_job_out
    to: index_backfill.kv_in

  # ── Backup coordinator ↔ router (positional pair #0) ───────────
  - from: backup_coordinator.kv_out
    to: kv_request_router.etcd_in
  - from: kv_request_router.etcd_out
    to: backup_coordinator.kv_in

  # ── Executor ↔ router (PROTO_INTERNAL_SQL pair) ─────────────────
  - from: relational_executor.kv_out
    to: kv_request_router.internal_sql_in
  - from: kv_request_router.compute_out
    to: relational_executor.kv_in

  # ── Proposal ingress: router → gateway → consensus ─────────────
  - from: kv_request_router.proposal_out
    to: gateway.client_requests
  # Reject feedback: the gateway refuses a proposal BEFORE assigning it
  # a correlation id (NOT_LEADER precedes next_corr_id), and without
  # this edge that refusal is dropped and the write waits out the 5s
  # inflight sweep instead of failing in milliseconds.
  - from: gateway.responses
    to: kv_request_router.gateway_reject
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: admission.credits
    to: gateway.credit_supply
  - from: control_plane.routing
    to: gateway.placement

  # ── Apply path: committed entries → KV worker → response ───────
  - from: consensus.committed_entries
    to: lattice_apply_bridge.committed_in
  - from: lattice_apply_bridge.kv_out
    to: kv_state_worker.commands
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  # ── Linearizable-read fence (unused at lin_reads=0, wired for
  #    parity with single-replicated-disk.yaml) ────────────────────
  - from: kv_request_router.lin_read_out
    to: consensus.read
  - from: consensus.applied
    to: kv_request_router.read_release
  - from: admission.permits
    to: consensus.read_permits

  # ── Clustor persistence ─────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
    rate: transaction
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  # Boot handoff: Raft resumes at the WAL replay high-water BEFORE
  # proposal intake opens. See single-replicated-disk.yaml for the
  # wedge this pair prevents.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
  - from: durability.installed_local
    to: consensus.snapshot_installed
  - from: consensus.wal_compact
    to: durability.compact_before
  - from: durability.metrics
    to: operations.ingest
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Observability fan-in → operations → HTTP /metrics ───────────
  - from: pg_edge_anchor.metrics
    to: adapter_metrics.events_in
  - from: mysql_edge_anchor.metrics
    to: adapter_metrics.events_in
  - from: kv_request_router.metrics
    to: adapter_metrics.events_in
  - from: kv_state_worker.metrics
    to: adapter_metrics.events_in
  - from: adapter_metrics.telemetry_out
    to: operations.ingest
  - from: consensus.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest

  # ── HTTP ingress (binds :19090 on the shared linux_net) ─────────
  - from: linux_net.net_out
    to: operations.net_in
  - from: operations.net_out
    to: linux_net.net_in
    rate: transaction
