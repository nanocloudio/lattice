# Lattice — the separated-compute STORAGE cluster: 3 voters, real
# consensus, and a `lattice.data` anchor instead of a client protocol
# anchor (RFC §14.10, §26 phase 9, §30).
#
# `multi-3node.yaml` with the edge swapped. That swap is the entire
# difference between a combined deployment and the storage half of a
# separated one, exactly as `single-replicated-data-surface.yaml` is to
# `single-replicated-lattice.yaml` — but with three replicas, which is
# what §30's slice actually asks for:
#
#   "one PostgreSQL compute graph uses lattice.data to execute table
#    creation, primary-key insert, point/range select, and transaction
#    commit against one remote three-replica durable range. The proof
#    kills compute, replaces the range leader, retries an ambiguously
#    delivered commit, and adds a read compute worker without copying
#    storage."
#
# Only the LEADER accepts writes. A follower REFUSES, but takes about
# five seconds to do it and names a fence rather than leadership:
# `-CLUSTERDOWN linearizable read fence unavailable` (measured in
# tests/cluster.rs). So a compute graph must dial the leader and re-dial
# after a leader change — and it cannot use a short timeout as a
# leadership signal, because a healthy follower looks identical to a
# dead one for those five seconds.
#
# TEMPLATE — render per node (see tests/cluster.rs):
#   __SELF_ID__      0 | 1 | 2
#   __DATA_PORT__    this node's lattice.data listen port
#   __HTTP_PORT__    per-node /metrics port
#   __LISTEN_PORT__  this node's raft peer port
#   __PEER0_PORT__ / __PEER1_PORT__ / __PEER2_PORT__
#   __PEER0_HOST__ / __PEER1_HOST__ / __PEER2_HOST__
#   __LIN_READS__
#
# Each node runs from its OWN working directory (wal/ is CWD-relative),
# and needs FLUXOR_PROJECT_ROOT set — the module search paths are
# relative to the project, not to the node.

target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

module_search_paths:
  - ../deps/clustor/modules/app
  - ./modules/app

modules:
  # ── Lattice edge + KV ───────────────────────────────────────────
  - name: lattice_data_anchor
    params:
      listen_port: __DATA_PORT__
  - name: kv_request_router
    params:
      # Phase 5 bench lever: ALL reads take the ReadIndex fence
      # (leadership probe + apply-horizon wait). 0 = snapshot reads.
      # ⚠ With 1: read-only or serial-per-conn clients only — mixed
      # pipelined conns reorder responses (no per-conn FIFO yet).
      lin_reads: __LIN_READS__
      # Declares that this graph replicates writes through Raft. Checked
      # against the `proposal_out` wiring at init: if that edge is missing
      # the module refuses to start, instead of silently serving every
      # write on the direct local path. See the router's `replicated` param.
      replicated: 1
  - name: kv_state_worker
  - name: lattice_apply_bridge

  # ── Clustor client-proposal pipeline ────────────────────────────
  - name: peer_router
    params:
      self_id: __SELF_ID__
      peer_count: 3
      listen_port: __LISTEN_PORT__
      peer0_port: __PEER0_PORT__
      peer1_port: __PEER1_PORT__
      peer2_port: __PEER2_PORT__
      # Per-peer IPv4 host. Localhost L2 renders these 127.0.0.1 (the
      # peer_router default); cross-machine L4 (Pi 5 voter + host voters)
      # renders real LAN IPs so raft peers dial across the wire.
      peer0_host: __PEER0_HOST__
      peer1_host: __PEER1_HOST__
      peer2_host: __PEER2_HOST__
  - name: gateway
    params:
      self_id: __SELF_ID__
  # ReadIndex permit source — bench posture: the CP proof input is
  # unwired, so the gate emits standing CP_FRESH permits (the same
  # CP-bypass as clustor's benches).
  - name: admission
  - name: control_plane
  - name: consensus
    params:
      self_id: __SELF_ID__
      voter_count: 3
      heartbeat_interval_ms: 150
      # Localhost 3-runtime rig shares 4 cores with a live substrate;
      # scheduler jitter under load delays heartbeats past the default
      # 1000 ms and churns elections. Widen the timeout so the rig
      # tolerates that jitter. Real timing verification belongs on
      # dedicated hardware (task #15), not this shared-host rig.
      election_timeout_ms: 4000
      # Latency: don't hold sparse proposals for the default 10 ms
      # batching window before append+AE.
      proposal_batch_timeout_ms: 1
      peer_count: 3
  - name: durability
    params:
      fsync_mode: 1
      # gw0: proven strictly better on the rig sweep (2026-07-18) —
      # the wall-clock window is pure ack latency; batching still
      # engages under burst via group_max_pending.
      group_window_ms: 0
      group_max_pending: 8
      # 4 MiB (not 256 KiB): each rotation runs a synchronous ~40 ms
      # snapshot persist — small segments put that stall in p99.
      segment_bytes: 4194304
      # Fresh log each boot (localhost bench) — no manual wal wipe needed
      # between runs. OMIT for crash-recovery scenarios.
      skip_replay: 1
      self_id: __SELF_ID__
      voter_count: 3
      partition_id: 0
  # `durability` runs the local snapshot/compaction loop and the peer
  # snapshot transfer. CAVEAT: manifest-only snapshots (no state body)
  # — crash-recovery replay only reconstructs ≥ the compaction floor.

  # ── Observability: metric fan-in + HTTP /metrics ────────────────
  - name: adapter_metrics
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: __HTTP_PORT__

wiring:
  # ── Transport: linux_net ↔ peer_router ──────────────────────────
  # net_out fans (via an auto-inserted tee) to peer_router + the data
  # anchor + operations. That tee is min-space gated: if ANY consumer's
  # net_in ring fills, the WHOLE fan-out stalls and every consumer
  # starves (the multi-node wedge — dialer nodes churned peer sockets
  # and stalled their own edge too). Size each consumer ring to 256 KiB
  # so no slow/idle consumer can gate the others.
  - from: linux_net.net_out
    to: peer_router.net_in
    buffer_bytes: 262144
  - from: peer_router.net_out
    to: linux_net.net_in

  # ── Lattice edge: anchor ↔ router (own linux_net lanes) ─────────
  - from: linux_net.net_out
    to: lattice_data_anchor.net_in
    buffer_bytes: 262144
  - from: lattice_data_anchor.net_out
    to: linux_net.net_in
  - from: lattice_data_anchor.kv_out
    to: kv_request_router.internal_data_in
  - from: kv_request_router.compute_out
    to: lattice_data_anchor.kv_in

  # ── Inbound peer traffic (peer_router demux) ────────────────────
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  # ── Outbound peer traffic ───────────────────────────────────────
  - from: consensus.rpc_out
    to: peer_router.peer_tx
  - from: consensus.net_out
    to: peer_router.repl_tx

  # ── Proposal ingress: router → gateway → consensus ─────────────
  - from: kv_request_router.proposal_out
    to: gateway.client_requests
  # Reject feedback: the gateway refuses a proposal BEFORE assigning it
  # a correlation id (NOT_LEADER precedes next_corr_id), and without
  # this edge that refusal is dropped and the write waits out the 5s
  # inflight sweep instead of failing in milliseconds.
  - from: gateway.responses
    to: kv_request_router.gateway_reject
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: admission.credits
    to: gateway.credit_supply
  - from: control_plane.routing
    to: gateway.placement

  - from: consensus.lag_signal
    to: admission.lag

  # ── Apply path: committed entries → KV worker → response ────────
  - from: consensus.committed_entries
    to: lattice_apply_bridge.committed_in
  - from: lattice_apply_bridge.kv_out
    to: kv_state_worker.commands
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  # ── Linearizable-read fence (Phase 5 ReadIndex) ─────────────────
  - from: kv_request_router.lin_read_out
    to: consensus.read
  - from: consensus.applied
    to: kv_request_router.read_release
  - from: admission.permits
    to: consensus.read_permits

  # ── Clustor persistence ─────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
    # Without a rate class the WAL entry-pump gets grant=0 and runs
    # `process_entries` once per step — 1 entry/tick regardless of backlog.
    # See `bare-metal-pi5.yaml` for the full note (~3.75× on durable writes).
    rate: transaction
  # A restarted replica reads its replayed log bodies back out of the
  # local WAL: replay restores the log, so raft log-matching succeeds and
  # the leader never re-ships those entries. Without this pair the apply
  # pipeline stalls at the first gap. Shares the WAL's random-access ports
  # with the replicator's NACK refetch of older entries; the request-id
  # namespaces keep the replies separable.
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this
  # onto durability.flushed, which also fans out durability acknowledgements.
  # (Present in every clustor config since 2ddd87f; lattice was missing it.)
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  # Raft §5.3 conflict repair + post-snapshot trim share this edge.
  - from: consensus.wal_compact
    to: durability.compact_before
  - from: durability.flushed
    to: consensus.wal_flushed
  # Cross-node DurabilityAck fan-in (spec §10.4.1) — REQUIRED for
  # quorum-fsync; without it commit stalls indefinitely multi-node.
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Snapshots: local loop + peer transfer ───────────────────────
  # Retention floor: min follower match gates snapshot triggers so
  # compaction never outruns a live-but-lagging voter (whose replicator
  # would otherwise NACK-loop on a compacted index forever and the lag
  # signal would strangle proposal credits — observed 2026-07-18).
  - from: consensus.retention_floor
    to: durability.retention_floor
  - from: durability.installed_local
    to: consensus.snapshot_installed
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  # App state-machine snapshot bodies (clustor RFC §2.1). The worker
  # labels each body with its own applied position; without this pair a
  # follower installing a snapshot gets a bare (term, index) and cannot
  # rebuild KV state.
  - from: durability.app_snapshot_ctl
    to: kv_state_worker.snapshot_import
    rate: transaction
  - from: kv_state_worker.snapshot_export
    to: durability.app_snapshot_body
    rate: transaction
  - from: durability.metrics
    to: operations.ingest

  # ── Observability fan-in → operations → HTTP /metrics ───────────
  - from: lattice_data_anchor.metrics
    to: adapter_metrics.events_in
  - from: kv_request_router.metrics
    to: adapter_metrics.events_in
  - from: kv_state_worker.metrics
    to: adapter_metrics.events_in
  - from: adapter_metrics.telemetry_out
    to: operations.ingest
  - from: consensus.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest

  # ── HTTP ingress (per-node __HTTP_PORT__) ───────────────────────
  - from: linux_net.net_out
    to: operations.net_in
    buffer_bytes: 262144
  - from: operations.net_out
    to: linux_net.net_in
    # linux_net.net_in is NetProto → edge would default to 'audio', over
    # operations.net_out's rate_class_max 'transaction'. /metrics only.
    rate: transaction
