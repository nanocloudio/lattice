# Lattice: single-node GRAPH + SEARCH + VECTOR graph (RFC database
# foundation §14.18–§14.21, Phase 8). One RESP surface on 6380 serving
# three capabilities with three separate semantic sets; every mutation
# is a canonical KV transaction through the same router and worker as
# everything else.
#
# ROUTER PAIRING: positional pair #2 — the ports named memcached_in/
# memcached_out — stamped PROTO_MEMCACHED. All sixteen router outputs
# are allocated and this composition has no memcached anchor.
#
# Run: `fluxor run configs/single-models.yaml`

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: model_edge_anchor
    params:
      listen_port: 6380
  - name: kv_request_router
  - name: kv_state_worker

wiring:
  - from: linux_net.net_out
    to: model_edge_anchor.net_in
  - from: model_edge_anchor.net_out
    to: linux_net.net_in

  - from: model_edge_anchor.kv_out
    to: kv_request_router.memcached_in
  - from: kv_request_router.memcached_out
    to: model_edge_anchor.kv_in

  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
