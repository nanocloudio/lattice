# Lattice: single-node full graph (all 14 Lattice modules + Clustor substrate).
#
# Composes:
#   - Fluxor foundation: linux_net + tls
#   - Clustor substrate (loaded from deps/clustor/modules)
#   - Lattice application: 14 modules from this repo's modules/app/
#
# Phase 0 status: every module declared here loads as a PIC ELF, but
# only redis_edge_anchor has real behaviour. Everything else is a stub
# returning 0 from module_step. The graph is wired so subsequent
# phases (router → KV worker → watch/lease → policy → metrics) drop
# implementations into existing slots without re-arranging.
#
# Run: `fluxor run --template configs/single.yaml`

target: linux
tick_us: 1000

platform:
  net: {}

module_search_paths:
  - ../deps/clustor/modules/app
  - ./modules/app

modules:
  # ── Fluxor foundation ────────────────────────────────────────────
  - name: linux_net
  - name: tls

  # ── Clustor substrate (selection) ────────────────────────────────
  - name: peer_router
  - name: gateway
  - name: consensus
  - name: durability
  - name: admission
  - name: control_plane
  - name: operations

  # ── Lattice edge anchors ─────────────────────────────────────────
  - name: etcd_edge_anchor
  - name: redis_edge_anchor
  - name: memcached_stream_anchor

  # Memcached UDP is disabled by default per the protocol RFC; flip
  # `enabled` to true in deployments that need datagram service.
  - name: memcached_datagram_anchor
    enabled: false

  # ── Lattice routing + KV core ────────────────────────────────────
  - name: kv_request_router
  - name: kv_state_worker

  # ── Lattice watch + lease services ───────────────────────────────
  - name: watch_registry
  - name: watch_fanout
  - name: lease_manager
  - name: ttl_scheduler

  # ── Lattice policy + compaction ──────────────────────────────────
  - name: auth_manager
  - name: quota_manager
  - name: compaction_coordinator

  # ── Lattice observability ────────────────────────────────────────
  - name: adapter_metrics

wiring:
  # ── Foundation transport ────────────────────────────────────────
  - from: linux_net.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: linux_net.net_in

  # ── Edge anchors ↔ transport ────────────────────────────────────
  # etcd and Redis use TLS-terminated transport in production graphs;
  # memcached TCP can use either.
  - from: tls.clear_out
    to: etcd_edge_anchor.net_in
  - from: etcd_edge_anchor.net_out
    to: tls.clear_in
  - from: tls.clear_out
    to: redis_edge_anchor.net_in
  - from: redis_edge_anchor.net_out
    to: tls.clear_in
  # Memcached TCP cleartext path.
  - from: linux_net.net_out
    to: memcached_stream_anchor.net_in
  - from: memcached_stream_anchor.net_out
    to: linux_net.net_in

  # ── Adapter ingress → router ────────────────────────────────────
  - from: etcd_edge_anchor.kv_out
    to: kv_request_router.etcd_in
  - from: redis_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: memcached_stream_anchor.kv_out
    to: kv_request_router.memcached_in
  - from: memcached_datagram_anchor.kv_out
    to: kv_request_router.memcached_udp_in

  # ── Router → anchors (responses) ────────────────────────────────
  - from: kv_request_router.etcd_out
    to: etcd_edge_anchor.routed_in
  - from: kv_request_router.redis_out
    to: redis_edge_anchor.kv_in
  - from: kv_request_router.memcached_out
    to: memcached_stream_anchor.routed_in
  - from: kv_request_router.memcached_udp_out
    to: memcached_datagram_anchor.routed_in

  # ── Control plane ───────────────────────────────────────────────
  - from: control_plane.proof
    to: admission.input
  - from: control_plane.tenant_records
    to: auth_manager.cp_in
  - from: control_plane.capabilities
    to: quota_manager.cp_in
  - from: control_plane.routing
    to: kv_request_router.route_plan
  - from: admission.fresh_state
    to: kv_request_router.cp_proof
  - from: quota_manager.quota_decision
    to: kv_request_router.quota_decision

  # ── Auth flow ───────────────────────────────────────────────────
  - from: redis_edge_anchor.auth_request
    to: auth_manager.auth_request
  - from: auth_manager.auth_decision
    to: redis_edge_anchor.auth_decision
  - from: auth_manager.decision_request
    to: operations.admin_req
  - from: operations.authorized
    to: auth_manager.decision_response
  - from: operations.denied
    to: auth_manager.decision_response

  # ── Quota disconnect signals ────────────────────────────────────
  - from: quota_manager.disconnect_out
    to: redis_edge_anchor.disconnect
  - from: quota_manager.throttle_out
    to: gateway.proposals

  # ── Core KV path ────────────────────────────────────────────────
  - from: kv_request_router.kv_out
    to: gateway.proposals
  - from: gateway.proposals_tagged
    to: kv_state_worker.commands
  - from: admission.permits
    to: kv_state_worker.read_permit
  - from: durability.quorum_durable
    to: kv_state_worker.durability
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  # ── Watch / lease continuity ────────────────────────────────────
  - from: kv_request_router.watch_ctrl
    to: watch_registry.ctrl_in
  - from: kv_state_worker.mutations
    to: watch_registry.mutations
  - from: watch_registry.events_out
    to: watch_fanout.events_in
  - from: watch_registry.replay_plan
    to: watch_fanout.replay_plan
  - from: watch_fanout.frames_out
    to: etcd_edge_anchor.watch_in
  - from: watch_registry.replay_plan
    to: watch_fanout.replay_plan

  # ── Watch resume backfill (Phase-2 slice C) ────────────────────
  # On a replay plan the fanout reads the missed window back through
  # the router with KV_OP_SCAN_VERSIONS and re-frames each version as
  # the event it originally was. In a MEMORY composition the provider
  # holds no history and answers COMPACTED, so the backfill reports
  # itself unserviceable rather than delivering a partial window —
  # which is the correct outcome here, not a gap.
  - from: watch_fanout.kv_out
    to: kv_request_router.internal_watch_in
  - from: kv_request_router.internal_watch_out
    to: watch_fanout.kv_in

  - from: watch_fanout.progress
    to: watch_registry.progress

  - from: kv_request_router.lease_ctrl
    to: lease_manager.ctrl_in
  - from: lease_manager.responses
    to: etcd_edge_anchor.lease_in
  - from: lease_manager.revoke
    to: kv_state_worker.lease_revoke

  - from: ttl_scheduler.tick_out
    to: lease_manager.tick
  - from: ttl_scheduler.expire_out
    to: kv_state_worker.expire

  # ── Placement epoch fan-out ─────────────────────────────────────
  # Substrate control_plane advances the cluster placement epoch
  # whenever a rebalance / admin operation lands. Every session-
  # bearing app module subscribes so it can bump its `session_epoch`
  # atomically and fence frames in flight from the prior epoch.
  - from: control_plane.epoch_events
    to: watch_registry.in_epoch_events
  - from: control_plane.epoch_events
    to: lease_manager.in_epoch_events
  - from: control_plane.epoch_events
    to: kv_state_worker.in_epoch_events

  # ── Compaction / retention ──────────────────────────────────────
  - from: kv_state_worker.compaction_floor
    to: compaction_coordinator.kv_floor
  - from: watch_registry.retention
    to: compaction_coordinator.watch_floor
  # Aggregated per-kpg retention floor from watch / lease / kv
  # subscribers. durability consults this before advancing
  # `compact_until` so a watcher's replay window stays satisfiable.
  - from: compaction_coordinator.retention_floor_out
    to: durability.retention_floor

  # ── Observability fan-in ────────────────────────────────────────
  - from: redis_edge_anchor.metrics
    to: adapter_metrics.events_in
  - from: etcd_edge_anchor.metrics
    to: adapter_metrics.events_in
  - from: memcached_stream_anchor.metrics
    to: adapter_metrics.events_in
  - from: kv_request_router.metrics
    to: adapter_metrics.events_in
  - from: kv_state_worker.metrics
    to: adapter_metrics.events_in
  - from: watch_registry.metrics
    to: adapter_metrics.events_in
  - from: watch_fanout.metrics
    to: adapter_metrics.events_in
  - from: lease_manager.metrics
    to: adapter_metrics.events_in
  - from: ttl_scheduler.metrics
    to: adapter_metrics.events_in
  - from: quota_manager.metrics
    to: adapter_metrics.events_in
  - from: compaction_coordinator.metrics
    to: adapter_metrics.events_in
  - from: adapter_metrics.telemetry_out
    to: operations.ingest
