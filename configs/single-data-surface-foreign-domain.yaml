# Lattice: a STORAGE graph whose one range lives in ANOTHER Clustor
# cluster domain (RFC §11.3 / §26.5, Phase 10 multi-cluster-domain
# routing). Same three modules as `single-data-surface.yaml`, but the
# router runs in ordered mode with a range map whose single descriptor
# binds `cluster_id = 1`, while the router itself serves
# `local_cluster_domain = 0`.
#
# Every key therefore resolves to a range this router cannot reach, and
# the router answers KV_RESULT_CROSS_DOMAIN with the target domain
# rather than serving a wrong local answer. `tests/live_data_surface.rs`
# drives it. Set `local_cluster_domain: 1` to prove the positive case —
# the same map then routes normally.

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: lattice_data_anchor
    params:
      listen_port: 7432
  - name: kv_request_router
    params:
      routing_mode: 2
      replicated: 0
      # This router serves cluster domain 0; the map's range is in 1.
      local_cluster_domain: 0
      # RANGE_MAP_UPDATE_V1: one range MIN..MAX, binding cluster_id=1,
      # partition 0. Generated via partition_map::encode_range_map_update.
      range_map: "0100010001004a00010000000200000001111111111111111111111111111111110000000001000000020100000000000100000001000000030a0000000101000b0000000102000c0000000103000a000000"
  - name: kv_state_worker

wiring:
  - from: linux_net.net_out
    to: lattice_data_anchor.net_in
  - from: lattice_data_anchor.net_out
    to: linux_net.net_in

  - from: lattice_data_anchor.kv_out
    to: kv_request_router.internal_data_in
  - from: kv_request_router.compute_out
    to: lattice_data_anchor.kv_in

  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
