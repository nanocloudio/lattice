# Lattice: a CROSS-RANGE TRANSACTION over two partitions (RFC database
# foundation §13, Phase 5).
#
# The two-partition graph from `single-relational-merge.yaml`, with the
# lifecycle supervisor replaced by a `txn_coordinator` driving one
# declared transaction whose halves land in DIFFERENT partitions.
#
# What this proves, and how to see it: after boot + start_delay_ms,
# both `txna` (partition 0) and `txnb` (partition 1) read back their
# committed values through any client. Before the decision they read
# KV_RESULT_TXN_PENDING, not a stale value and not absent. No
# single-partition KV_OP_TXN can write both keys — the router refuses
# that with KV_RESULT_CROSS_RANGE — so a committed pair is evidence
# that two-phase commit ran, not that a shortcut was taken.

target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

module_search_paths:
  - ../deps/clustor/modules/app
  - ./modules/app

modules:
  # ── Relational front (identical to single-relational-disk.yaml) ─
  - name: pg_edge_anchor
    params:
      listen_port: 5432
  - name: mysql_edge_anchor
    params:
      listen_port: 3306
  - name: relational_executor

  # ── Range supervisor: the declared MERGE (§12.2) ─────────────────
  # Cross-range transaction coordinator (§13, Phase 5). Declares ONE
  # transaction whose two halves land in DIFFERENT partitions.
  #
  # The keys are chosen against the DECODED map, and only after two
  # wrong guesses made by eyeballing its hex. The real ranges are
  #   partition 0: [MIN, 80000002000000010180000002)
  #   partition 1: [80000002000000010180000002, MAX)
  # The split is ONE 13-byte key; scanning the frame for 0x80000002
  # patterns found what looked like two 9-byte keys and neither guess
  # built from that was right. `tests/contract_txn_map_placement.rs`
  # now decodes this exact frame and asserts the two keys land in
  # DIFFERENT partitions, so the premise of this config is checked by
  # the test suite instead of by a comment.
  #
  # 74786e61 = "txna", below the split. key_b sorts above it.
  #
  # No single-partition KV_OP_TXN can write this pair: the router
  # answers KV_RESULT_CROSS_RANGE. A committed pair is therefore
  # evidence that two-phase commit ran.
  - name: txn_coordinator
    params:
      mode: 1
      txn_id: 4242
      read_timestamp: 1000
      start_delay_ms: 6000
      partition_a: 0
      partition_b: 1
      key_a: "74786e61"
      val_a: "76616c7565612d636f6d6d6974746564"
      key_b: "800000020100000002aa"
      val_b: "76616c7565622d636f6d6d6974746564"

  # Read-back surface. GET on the two keys is how the transaction is
  # verified from outside; the coordinator's own telemetry is a
  # self-report and proves nothing.
  - name: redis_edge_anchor
    params:
      listen_port: 6379

  - name: kv_request_router
    params:
      lin_reads: 0
      replicated: 1
      routing_mode: 2
      # RANGE_MAP_UPDATE_V1, 2 descriptors: [MIN, split) → partition 0,
      # [split, MAX) → partition 1. Regenerate with the layout in
      # modules/common/partition_map.rs if the descriptor wire form or
      # the relational key encoding changes — tests/live_relational.rs
      # recomputes it from source and will disagree loudly.
      range_map: ""
  - name: kv_state_worker
    params:
      # Memory provider for BOTH partitions. What is under test here
      # is the §13.2 decision protocol, and prepare/resolve run through
      # the same `apply_mat` path on either provider — Phase 5a is
      # implemented at the store-op level precisely so the two cannot
      # diverge. Partition 1's disk store reports ENODEV on this host
      # (store_id 1 has no backing slot), and debugging a storage-slot
      #issue in the middle of a transaction test would only add a
      # variable. Durability of the intent records is covered by the
      # existing disk crash-injection suite.
      state_store: 0
  - name: kv_state_worker_p1
    type: kv_state_worker
    params:
      state_store: 0
  - name: lattice_apply_bridge
  - name: lattice_apply_bridge_p1
    type: lattice_apply_bridge

  # ── Clustor partition 0 ─────────────────────────────────────────
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: gateway
    params:
      self_id: 0
  - name: admission
  - name: control_plane
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
      partition_id: 0
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      segment_bytes: 262144
      self_id: 0
      voter_count: 1
      partition_id: 0

  # ── Clustor partition 1 ─────────────────────────────────────────
  - name: peer_router_p1
    type: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9091
      peer0_port: 9091
  - name: gateway_p1
    type: gateway
    params:
      self_id: 0
  - name: consensus_p1
    type: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
      partition_id: 1
  - name: durability_p1
    type: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      segment_bytes: 262144
      self_id: 0
      voter_count: 1
      partition_id: 1

wiring:
  # ── TCP transport ───────────────────────────────────────────────
  - from: linux_net.net_out
    to: pg_edge_anchor.net_in
  - from: pg_edge_anchor.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: mysql_edge_anchor.net_in
  - from: mysql_edge_anchor.net_out
    to: linux_net.net_in

  # ── Connector ↔ executor ────────────────────────────────────────
  - from: pg_edge_anchor.sql_out
    to: relational_executor.pg_in
  - from: relational_executor.pg_out
    to: pg_edge_anchor.sql_in
  - from: mysql_edge_anchor.sql_out
    to: relational_executor.mysql_in
  - from: relational_executor.mysql_out
    to: mysql_edge_anchor.sql_in

  # ── Executor ↔ router (PROTO_INTERNAL_SQL pair) ─────────────────
  - from: relational_executor.kv_out
    to: kv_request_router.internal_sql_in
  - from: kv_request_router.compute_out
    to: relational_executor.kv_in

  # ── RESP client ↔ ip ↔ router ─────────────────────────────────
  - from: linux_net.net_out
    to: redis_edge_anchor.net_in
  - from: redis_edge_anchor.net_out
    to: linux_net.net_in
  - from: redis_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: kv_request_router.redis_out
    to: redis_edge_anchor.kv_in

  # ── Coordinator ↔ router ──────────────────────────────────────
  # The internal-lifecycle ingress is the only one allowed to carry
  # KV_OP_TARGETED, which is exactly what addressing two participants
  # by partition requires.
  - from: txn_coordinator.kv_out
    to: kv_request_router.internal_lifecycle_in
  - from: kv_request_router.internal_lifecycle_out
    to: txn_coordinator.kv_in

  # ── Partition 0: proposals → gateway → consensus ────────────────
  - from: kv_request_router.proposal_out
    to: gateway.client_requests
  # Reject feedback: the gateway refuses a proposal BEFORE assigning it
  # a correlation id (NOT_LEADER precedes next_corr_id), and without
  # this edge that refusal is dropped and the write waits out the 5s
  # inflight sweep instead of failing in milliseconds.
  - from: gateway.responses
    to: kv_request_router.gateway_reject
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: admission.credits
    to: gateway.credit_supply
  - from: control_plane.routing
    to: gateway.placement

  # ── Partition 1: proposals → gateway_p1 → consensus_p1 ──────────
  # One admission and one control_plane feed both gateways: credits
  # and placement are node-scoped, the Raft state is not.
  - from: kv_request_router.proposal1_out
    to: gateway_p1.client_requests
  - from: gateway_p1.proposals_tagged
    to: consensus_p1.proposals_tagged
  - from: consensus_p1.proposal_assigned
    to: gateway_p1.proposal_assigned
  - from: consensus_p1.leader_state
    to: gateway_p1.leader_state
  - from: admission.credits
    to: gateway_p1.credit_supply
  - from: control_plane.routing
    to: gateway_p1.placement

  # ── Apply paths: one per partition, one worker per range ────────
  - from: consensus.committed_entries
    to: lattice_apply_bridge.committed_in
  - from: lattice_apply_bridge.kv_out
    to: kv_state_worker.commands
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  - from: consensus_p1.committed_entries
    to: lattice_apply_bridge_p1.committed_in
  - from: lattice_apply_bridge_p1.kv_out
    to: kv_state_worker_p1.commands
  - from: kv_request_router.kv1_out
    to: kv_state_worker_p1.commands
  - from: kv_state_worker_p1.responses
    to: kv_request_router.kv_in

  # ── Clustor persistence, partition 0 ────────────────────────────
  - from: consensus.log_append
    to: durability.entries
    rate: transaction
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
  - from: durability.installed_local
    to: consensus.snapshot_installed
  - from: consensus.wal_compact
    to: durability.compact_before
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Clustor persistence, partition 1 ────────────────────────────
  - from: consensus_p1.log_append
    to: durability_p1.entries
    rate: transaction
  - from: consensus_p1.entry_request
    to: durability_p1.entry_request
    buffer_bytes: 8192
  - from: durability_p1.entry_reply
    to: consensus_p1.entry_reply
    buffer_bytes: 8192
  - from: durability_p1.replay_complete
    to: consensus_p1.wal_replay_complete
    rate: transaction
  - from: durability_p1.flushed
    to: consensus_p1.wal_flushed
  - from: durability_p1.installed_local
    to: consensus_p1.snapshot_installed
  - from: consensus_p1.wal_compact
    to: durability_p1.compact_before
  - from: durability_p1.quorum_durable
    to: consensus_p1.durable
