# Disk state-store composition — single-replicated-lattice.yaml with the
# kv_state_worker running the ORDERED DISK state-store provider,
# WITH the app-snapshot edges wired (the bare-metal difference)
# (state_store: 1, RFC database foundation §6.3/§30). The semantic
# engine is unchanged; only the physical materialization provider
# differs. Requires a writable `kv/` directory in the process working
# directory (mkdir kv), exactly as durability requires `wal/`.
#
# Base graph: Lattice's KV state machine driven by Clustor's replicated
# commit pipeline (single-node degenerate Raft, voter_count=1).
#
# Write path (now fully wired — proposal ingress ported from
# clustor/configs/single-throughput.yaml, ingress swapped to the
# lattice router and egress to the lattice apply bridge):
#   redis_edge_anchor → kv_request_router.proposal_out
#     → gateway.client_requests → gateway.proposals_tagged
#     → consensus (raft append → durability → quorum → commit → apply)
#     → consensus.committed_entries → lattice_apply_bridge
#     → kv_state_worker.commands → kv_state_worker.responses
#     → kv_request_router.kv_in → redis_edge_anchor.kv_in
#
# Reads (linearizable GET) ride the same proposal→commit→apply path in
# this config (router.proposal_out is the only worker feed); the
# ReadIndex fast-path (consensus.read, RFC §4.3) is a later
# refinement and is left unwired.
#
# Dependencies that MUST be present for proposals to flow:
#   - admission: supplies gateway.credit_supply. Without it the
#     gateway's throttle never admits and proposals never reach raft
#     (the original scaffold's silent-drop bug).
#   - control_plane: gateway.placement.
#   - voter_count: 1 on consensus/durability so a single node forms
#     its own quorum and actually commits.
#
# Run: mkdir -p wal kv && \
#      FLUXOR_LINUX_BIN=<…>/fluxor-linux fluxor run configs/single-replicated-disk.yaml

target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

module_search_paths:
  - ../deps/clustor/modules/app
  - ./modules/app

modules:
  # ── Lattice edge + KV ───────────────────────────────────────────
  - name: redis_edge_anchor
  - name: kv_request_router
    params:
      # Snapshot reads (DIRECT path): each GET hits the worker directly
      # rather than taking the ReadIndex fence. Set to 1 to classify all
      # reads linearizable (FENCE path) — but note the ReadIndex fast-path
      # (consensus.read) is unwired in this single-node example, so
      # lin_reads=1 makes reads return CLUSTERDOWN here.
      #
      # The old ⚠ constraint ("mixed pipelining across paths breaks
      # response order") is RESOLVED as of task #17: the router's per-key
      # dependency barrier serializes only same-key cross-path ops (so a
      # DIRECT read of a key with an in-flight CONSENSUS write to that key
      # waits — read-your-writes), while redis_edge_anchor's per-conn
      # reorder buffer restores FIFO for the independent ops that now
      # pipeline. So mixed-op RESP pipelining is safe here at lin_reads=0.
      lin_reads: 0
      # Declares that this graph replicates writes through Raft. Checked
      # against the `proposal_out` wiring at init: if that edge is missing
      # the module refuses to start, instead of silently serving every
      # write on the direct local path. See the router's `replicated` param.
      replicated: 1
  - name: kv_state_worker
    params:
      # Ordered disk state-store provider (RFC §6.3/§30): committed
      # mutations materialize into bounded memtables + immutable
      # sorted runs under `kv/` via the linux FS provider — the same
      # provider-call path durability's WAL uses for `wal/`. The
      # semantic engine and every result byte are identical to the
      # memory provider; the fixed 1024-key limit is gone.
      state_store: 1
      # 0 = `kv/<8.3 name>` under the process working directory
      # (linux). Set 1 on bare-metal FAT32 for 8.3 names at the root.
      root_path: 0
  - name: lattice_apply_bridge

  # ── Clustor client-proposal pipeline ────────────────────────────
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: gateway
    params:
      self_id: 0
  # ReadIndex permit source. BENCH POSTURE: the CP proof input is left
  # unwired (no real control plane here), so the gate stays at its
  # init-optimistic CP_FRESH and emits a standing permit every step —
  # the same CP-bypass clustor's bench configs use. Production wires
  # control_plane.proof → admission.input and permits stop when the CP
  # proof goes Stale/Expired (LIN-BOUND fail-closed).
  - name: admission
  - name: control_plane
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      # Small segments so rotation → snapshot → compact actually exercises
      # under test load (default 64 MiB would never rotate in a session).
      segment_bytes: 262144
      self_id: 0
      voter_count: 1
      partition_id: 0
  # The snapshot/compaction loop runs inside `durability`: WAL rotation
  # fires a snapshot and the persisted manifest advances the log floor.
  # NOTE the FS contract has no unlink yet — "compacted" advances
  # oldest_segment_seq and stops serving those entries, but segment
  # FILES remain on disk until an out-of-band GC (fluxor SDK gap,
  # tracked). Requires a `wal/` dir (linux layout); bare-metal FAT32
  # needs `root_path: 1`.

  # ── Observability: metric fan-in + HTTP /metrics ────────────────
  - name: adapter_metrics
  - name: operations
    params:
      # bench profile: export every 250 ms so a short window captures
      # fresh samples (prod default is 1 s).
      emit_interval_ms: 250
      listen_port: 19090

wiring:
  # ── Lattice edge: anchor ↔ router ───────────────────────────────
  - from: linux_net.net_out
    to: redis_edge_anchor.net_in
  - from: redis_edge_anchor.net_out
    to: linux_net.net_in
  - from: redis_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: kv_request_router.redis_out
    to: redis_edge_anchor.kv_in

  # ── Proposal ingress: router → gateway → consensus ─────────────
  - from: kv_request_router.proposal_out
    to: gateway.client_requests
  # Reject feedback: the gateway refuses a proposal BEFORE assigning it
  # a correlation id (NOT_LEADER precedes next_corr_id), and without
  # this edge that refusal is dropped and the write waits out the 5s
  # inflight sweep instead of failing in milliseconds.
  - from: gateway.responses
    to: kv_request_router.gateway_reject
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: admission.credits
    to: gateway.credit_supply
  - from: control_plane.routing
    to: gateway.placement

  # ── Apply path: Raft-committed entries → KV worker → response ───
  # WRITES travel router.proposal_out → consensus → committed_entries →
  # apply_bridge → worker. READS (use_consensus=false) travel the direct
  # router.kv_out → worker path (serializable/snapshot semantics today; the
  # linearizable ReadIndex fast-path via consensus.read is a later
  # refinement). worker.commands fans in both sources.
  - from: consensus.committed_entries
    to: lattice_apply_bridge.committed_in
  - from: lattice_apply_bridge.kv_out
    to: kv_state_worker.commands
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  # ── Linearizable-read fence (Phase 5 ReadIndex) ─────────────────
  # Lin-classified GETs: router stashes the command, submits the fence
  # here, and forwards to the worker only on the release. Snapshot
  # reads keep the direct router.kv_out path — the A/B split.
  - from: kv_request_router.lin_read_out
    to: consensus.read
  - from: consensus.applied
    to: kv_request_router.read_release
  - from: admission.permits
    to: consensus.read_permits

  # ── Clustor persistence ─────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
    # Without a rate class the WAL entry-pump gets grant=0 and runs
    # `process_entries` once per step — 1 entry/tick regardless of backlog.
    # See `bare-metal-pi5.yaml` for the full note (~3.75× on durable writes).
    rate: transaction
  # A restarted replica reads its replayed log bodies back out of the
  # local WAL: replay restores the log, so raft log-matching succeeds and
  # the leader never re-ships those entries. Without this pair the apply
  # pipeline stalls at the first gap. Shares the WAL's random-access ports
  # with the replicator's NACK refetch of older entries; the request-id
  # namespaces keep the replies separable.
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water BEFORE proposal intake opens. Never multiplex this
  # onto `durability.flushed`, which also fans out durability acks.
  #
  # Missing here until 2026-07-27, and it is not cosmetic: with a
  # non-empty WAL this graph replayed the old log, then wedged the write
  # path after ~145 further appends — `consensus.log_append` filled to
  # 8136/8192 and `durability` stopped draining it, while the WAL sat
  # idle. Reads kept serving, so it looked healthy. A fresh WAL hid the
  # bug entirely (3000/3000 writes fine), which is why it only ever
  # showed up on repeat runs against an existing log.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed

  - from: durability.installed_local
    to: consensus.snapshot_installed
  - from: consensus.wal_compact
    to: durability.compact_before
  # ── App state-machine snapshot bodies ──────────────────────────
  # THE POINT OF THIS CONFIG. `bare-metal-pi5-disk.yaml` wires these
  # two edges (inherited from bare-metal-pi5.yaml, where the
  # snapshot/compaction loop runs on WAL rotation);
  # `single-replicated-disk.yaml` wires NEITHER. That difference is
  # what makes the disk composition exercise the provider's
  # capture/install EXCLUSION FENCES on bare metal and never on linux.
  #
  # With `segment_bytes` small enough for rotation to fire (see the
  # durability block), driving past the 384-record flush watermark here
  # exercises capture-vs-flush contention on the host. See
  # `tests/loadtest_redis_disk_snap.rs` and the fence-starvation tests
  # in `tests/contract_disk_store.rs`.
  - from: durability.app_snapshot_ctl
    to: kv_state_worker.snapshot_import
    rate: transaction
  - from: kv_state_worker.snapshot_export
    to: durability.app_snapshot_body
    rate: transaction
  - from: durability.metrics
    to: operations.ingest
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Observability fan-in → operations → HTTP /metrics ───────────
  # Lattice app modules fan in through adapter_metrics; substrate
  # modules emit MSG_METRIC_SAMPLE straight to operations.ingest.
  - from: redis_edge_anchor.metrics
    to: adapter_metrics.events_in
  - from: kv_request_router.metrics
    to: adapter_metrics.events_in
  - from: kv_state_worker.metrics
    to: adapter_metrics.events_in
  - from: adapter_metrics.telemetry_out
    to: operations.ingest
  - from: consensus.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest

  # ── HTTP ingress (binds :19090 on the shared linux_net) ─────────
  - from: linux_net.net_out
    to: operations.net_in
  - from: operations.net_out
    to: linux_net.net_in
    # linux_net.net_in is NetProto → edge would default to 'audio', over
    # operations.net_out's rate_class_max 'transaction'. /metrics only.
    rate: transaction
