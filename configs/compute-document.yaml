# Lattice: a DOCUMENT compute graph over the separated data surface
# (RFC §14.9, §26 phase 9, §30's "not SQL-specific" requirement).
#
# §30 asks for "at least one document/search or document/vector model
# worker through the same surface to prove that it is not SQL-specific".
# This is that graph. It is `compute-relational.yaml` with the entire
# SQL front end — both connectors and the relational executor —
# replaced by `doc_edge_anchor`, the Mongo/document surface. The data
# client underneath is unchanged and unaware: it carries whatever
# MSG_KV_REQUEST envelopes reach it, and a document worker emits the
# same envelopes a relational one does.
#
# That is the whole proof. The data surface never learns whether the
# KV operations crossing it were compiled from SQL or from a Mongo
# find; if the document path works here with a byte-for-byte identical
# client and storage half, the surface is not SQL-specific by
# construction, not by assertion.
#
# `doc_edge_anchor` speaks the Mongo wire on 27018 and sends its KV work
# to `lattice_data_client`, exactly where `relational_executor` sent
# its. Run the storage graph first
# (configs/single-data-surface.yaml), then this.

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: doc_edge_anchor
    params:
      listen_port: 27018
  - name: lattice_data_client
    params:
      # 127.0.0.1 packed. The storage graph's data anchor.
      server_ip: 2130706433
      server_port: 7432
      range_id: 1
      range_generation: 1
      session_id: 1
      session_epoch: 1
      database_id: 1
      server2_ip: 2130706433
      server2_port: 0
      server3_ip: 2130706433
      server3_port: 0

wiring:
  # ── Client-facing Mongo wire + the dial-out ─────────────────────
  - from: linux_net.net_out
    to: doc_edge_anchor.net_in
  - from: doc_edge_anchor.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: lattice_data_client.net_in
  - from: lattice_data_client.net_out
    to: linux_net.net_in

  # ── Document worker ↔ data client ───────────────────────────────
  #
  # The one wiring that matters: the document anchor's KV work goes to
  # the data client, byte-identically to where the relational executor
  # sent its. In the COMBINED document graph these read
  # `kv_request_router.etcd_in` / `.etcd_out`.
  - from: doc_edge_anchor.kv_out
    to: lattice_data_client.kv_in
  - from: lattice_data_client.kv_out
    to: doc_edge_anchor.kv_in
