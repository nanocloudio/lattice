# Lattice: single-node WIDE-COLUMN graph (RFC database foundation
# §14.17, Phase 8). A real CQL client connects on 9042 and can CREATE
# TABLE, INSERT, and SELECT; rows live as CELLS in the canonical KV
# store, a statement's cells commit as one KV transaction, and cell
# timestamps are committed inputs.
#
# ROUTER PAIRING: positional pair #1 — the ports named redis_in/
# redis_out — stamped PROTO_REDIS. All sixteen router outputs are
# allocated and this composition has no redis anchor; the names are
# positional history.
#
# Run: `fluxor run configs/single-widecolumn.yaml`
# Then any CQL v4 client on 9042 (see tests/live_relational.rs for the
# raw-frame drive).

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: wide_edge_anchor
    params:
      listen_port: 9042
  - name: kv_request_router
  - name: kv_state_worker

wiring:
  - from: linux_net.net_out
    to: wide_edge_anchor.net_in
  - from: wide_edge_anchor.net_out
    to: linux_net.net_in

  - from: wide_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: kv_request_router.redis_out
    to: wide_edge_anchor.kv_in

  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
