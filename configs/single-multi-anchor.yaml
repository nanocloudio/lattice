# Lattice: single-node multi-anchor graph proving per-port demux.
#
# Brings up redis_edge_anchor (port 6379), memcached_stream_anchor
# (port 11211), and etcd_edge_anchor (port 2379) all sharing the
# same `linux_net` net_out broadcast channel — the configuration
# that previously corrupted traffic before the Phase 6 demux fix.
#
# With per-port filtering on NET_MSG_BOUND / NET_MSG_ACCEPTED,
# each anchor only claims connections whose listener port matches
# its own CMD_BIND, so the three services coexist without their
# wire formats colliding.

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: redis_edge_anchor
  - name: memcached_stream_anchor
  - name: etcd_edge_anchor
  - name: kv_request_router
  - name: kv_state_worker

wiring:
  # ── TCP transport (one broadcast channel, three consumers) ─────
  - from: linux_net.net_out
    to: redis_edge_anchor.net_in
  - from: linux_net.net_out
    to: memcached_stream_anchor.net_in
  - from: linux_net.net_out
    to: etcd_edge_anchor.net_in
  - from: redis_edge_anchor.net_out
    to: linux_net.net_in
  - from: memcached_stream_anchor.net_out
    to: linux_net.net_in
  - from: etcd_edge_anchor.net_out
    to: linux_net.net_in

  # ── Anchors ↔ router ───────────────────────────────────────────
  - from: redis_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: kv_request_router.redis_out
    to: redis_edge_anchor.kv_in
  - from: memcached_stream_anchor.kv_out
    to: kv_request_router.memcached_in
  - from: kv_request_router.memcached_out
    to: memcached_stream_anchor.routed_in
  - from: etcd_edge_anchor.kv_out
    to: kv_request_router.etcd_in
  - from: kv_request_router.etcd_out
    to: etcd_edge_anchor.routed_in

  # ── Router ↔ worker ────────────────────────────────────────────
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
