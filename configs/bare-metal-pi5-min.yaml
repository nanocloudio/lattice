# Lattice Pi 5 NETWORK-FOCUS profile — minimal graph for pipeline/latency
# attribution. NOT durable: redis → router → worker, in-memory KV, NO
# consensus / WAL / observability. 3 app modules vs 24 in bare-metal-pi5.yaml.
#
# Purpose: isolate the bare-metal network + minimal-pipeline latency floor and
# test whether per-step WORK (module count) drives the ~12ms PING / ~21ms GET
# seen on the full graph. If PING/GET collapse here, per-step work is the lever.
#
# No persistent WAL → no replay/apply bloat across boots → clean comparable
# numbers without wiping the nvme.
#
# Boot:  fluxor rig test --rig pi5-a --scenario tests/hardware/lattice_pi5_boot_min.toml
#        (or temporarily point lattice_pi5_boot.toml at this config)
# Drive: lattice-loadgen --host 192.168.1.9:6379 ...

target: pi5
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}
  debug:
    to: net
    monitor: true

module_search_paths:
  - ../deps/clustor/modules/app
  - ./modules/app

modules:
  - name: redis_edge_anchor
  - name: kv_request_router
  - name: kv_state_worker

wiring:
  # ── bare-metal TCP transport (ip stack) ─────────────────────────
  - from: ip.net_out
    to: redis_edge_anchor.net_in
  - from: redis_edge_anchor.net_out
    to: ip.net_in

  # ── anchor ↔ router ─────────────────────────────────────────────
  - from: redis_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: kv_request_router.redis_out
    to: redis_edge_anchor.kv_in

  # ── router ↔ worker (direct, in-memory; no consensus) ───────────
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
