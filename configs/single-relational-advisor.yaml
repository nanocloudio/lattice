# Lattice: single-node relational graph (RFC database foundation §14.1's
# "combined graph", Phase 7).
#
# A real `psql` connects on 5432 and can CREATE TABLE, INSERT and SELECT.
# The whole point of the composition is what is NOT duplicated to get
# there: there is one KV engine, one durability path and one catalog
# underneath, and the connector contributes only PostgreSQL's spelling of
# things.
#
#   foundation/linux_net    TCP
#   pg_edge_anchor          v3 wire: startup, simple query, result encoding
#   mysql_edge_anchor       MySQL wire: handshake, COM_QUERY, text rows
#   relational_executor     parse + bind + execute → KV ops
#   kv_request_router       envelope translation + inflight
#   kv_state_worker         the same state machine Redis SET lands in
#
# The executor speaks to the router as PROTO_INTERNAL_SQL on its own port
# pair, for the same reason each client protocol has one: the router
# routes a reply by the protocol byte of its request, so a shared pair
# would deliver replies to the wrong caller.
#
# This is the MEMORY composition, so it is bounded by the in-memory
# table's 1024 keys and holds no history. `single-relational-disk.yaml`
# is the durable one.
#
# BOTH connectors are loaded against ONE executor, which is the
# composition §14.1 describes and the reason the split is worth having:
# a table created through psql is visible through mariadb, because there
# is one catalog rather than two.
#
# Run: `fluxor run configs/single-relational.yaml`
# Then: `psql    -h 127.0.0.1 -p 5432 -U lattice -d lattice`
#   or: `mariadb -h 127.0.0.1 -P 3306 -u lattice --skip-ssl`

target: linux
tick_us: 1000

platform:
  net: {}

# anchor ↔ executor, executor ↔ router and router ↔ worker are all
# bidirectional pairs.
scheduler:
  accept_cycles: true

modules:
  - name: pg_edge_anchor
    params:
      listen_port: 5432
  - name: mysql_edge_anchor
    params:
      listen_port: 3306
  - name: relational_executor
  - name: index_backfill
  - name: placement_advisor
    params:
      # A deliberately LOW split floor. This is a demonstration
      # composition: production floors are thousands of keys, and at
      # that scale neither a split recommendation nor §12.4's hot-key
      # REFUSAL is reachable in a short run. Lowering the floor makes
      # both verdicts observable without faking the load.
      min_split_keys: 4
      cooldown_ms: 1
  - name: kv_request_router
  - name: kv_state_worker

wiring:
  # ── TCP transport ───────────────────────────────────────────────
  - from: linux_net.net_out
    to: pg_edge_anchor.net_in
  - from: pg_edge_anchor.net_out
    to: linux_net.net_in

  - from: linux_net.net_out
    to: mysql_edge_anchor.net_in
  - from: mysql_edge_anchor.net_out
    to: linux_net.net_in

  # ── Connector ↔ executor ────────────────────────────────────────
  # Statement TEXT out, TYPED values back. The connector does not parse
  # (§14.2 makes that shared) and the executor does not format (§14.3
  # gives the connector its own result encoding).
  - from: pg_edge_anchor.sql_out
    to: relational_executor.pg_in
  - from: relational_executor.pg_out
    to: pg_edge_anchor.sql_in
  - from: mysql_edge_anchor.sql_out
    to: relational_executor.mysql_in
  - from: relational_executor.mysql_out
    to: mysql_edge_anchor.sql_in

  # ── Placement advisor ↔ router (positional pair #0) ────────────
  # Advisory only: it has no edge to range_supervisor, and §12.4 is
  # why — an advisor that could act would make every policy bug a
  # topology change.
  - from: placement_advisor.kv_out
    to: kv_request_router.etcd_in
  - from: kv_request_router.etcd_out
    to: placement_advisor.kv_in

  # §12.4's MEASURED load signal: the router counts writes per range
  # at its dispatch chokepoint and the advisor differences them.
  - from: kv_request_router.metrics
    to: placement_advisor.signal_in

  # ── Backfill worker ↔ router (PROTO_INTERNAL_JOB pair) ─────────
  - from: index_backfill.kv_out
    to: kv_request_router.internal_job_in
  - from: kv_request_router.internal_job_out
    to: index_backfill.kv_in

  # ── Executor ↔ router ───────────────────────────────────────────
  - from: relational_executor.kv_out
    to: kv_request_router.internal_sql_in
  - from: kv_request_router.compute_out
    to: relational_executor.kv_in

  # ── Router ↔ worker ─────────────────────────────────────────────
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
