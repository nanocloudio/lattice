# Lattice: single-node minimal etcd Linux smoke graph with Lease.
#
# Extends `single-minimal-etcd.yaml` by wiring `lease_manager` into
# the etcd anchor's `lease_ctrl_out` / `lease_in` ports. Used to drive
# real `LeaseGrant` / `LeaseRevoke` end-to-end via the upstream
# `etcd-client` crate.
#
#   foundation/linux_net    TCP (port 2379 — etcd default)
#   etcd_edge_anchor        HTTP/2 + HPACK + gRPC (KV + Lease subset)
#   kv_request_router       envelope translation + per-corr_id inflight
#   kv_state_worker         deterministic in-memory KV
#   lease_manager           grant / revoke / keepalive / time_to_live
#
# `lease_manager.tick` is left unwired in this graph — TTL-driven
# expiry needs `ttl_scheduler`, which is exercised by the bare-metal
# integration. Grant + Revoke round-trips do not require ticks.

target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: etcd_edge_anchor
  - name: kv_request_router
  - name: kv_state_worker
  - name: lease_manager

wiring:
  # ── TCP transport ───────────────────────────────────────────────
  - from: linux_net.net_out
    to: etcd_edge_anchor.net_in
  - from: etcd_edge_anchor.net_out
    to: linux_net.net_in

  # ── Anchor ↔ router (ingress + response) ───────────────────────
  - from: etcd_edge_anchor.kv_out
    to: kv_request_router.etcd_in
  - from: kv_request_router.etcd_out
    to: etcd_edge_anchor.routed_in

  # ── Router ↔ worker (command + applied) ────────────────────────
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  # ── Anchor ↔ lease_manager (grant/revoke + state) ──────────────
  - from: etcd_edge_anchor.lease_ctrl
    to: lease_manager.ctrl_in
  - from: lease_manager.responses
    to: etcd_edge_anchor.lease_in
