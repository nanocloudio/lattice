version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# Phase 7 — adapter between Clustor's commit pipeline and Lattice's
# KV state machine. Subscribes to
# `consensus.committed_entries` (MSG_COMMITTED_ENTRY: term, index,
# body) and re-emits each entry's body as `MSG_KV_COMMAND` on
# `kv_out`, ordered by raft commit index. The kv_state_worker reads
# from `kv_out` exactly as it does in the single-node graph, but the
# committed entries now arrive through the raft replication chain
# instead of directly from kv_request_router.
#
# Each committed entry's body is expected to be the verbatim
# MSG_KV_COMMAND payload that kv_request_router produces, prepended
# by raft proposal framing (handled upstream by the gateway codec).
#
# For reads (linearizable GET), kv_request_router still forwards
# straight to kv_state_worker — consensus only sequences writes.
#
# A second entry kind, `LATTICE_RECORD_TAG`, carries
# replicated control records (timestamp-allocator advances, worker
# leases, and the cluster clock) that must NOT reach the state machine
# as commands. The bridge demuxes them onto `records_out` as
# `[record_msg_type]` envelopes in commit order; worker-lease grants
# (MSG_TS_LEASE_GRANT) and clock ticks (MSG_LEASE_TICK) are also
# forwarded in-band on `kv_out`, strictly ordered against the commands
# around them, which is what makes per-write commit-timestamp
# assignment and every TTL decision deterministic across replicas and
# replay.

[[ports]]
name = "committed_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# Committed lattice record entries (LATTICE_RECORD_TAG), demuxed in
# commit order. Wire per record: `[record_msg_type][len][record…]`.
# Feed this to `timestamp_allocator.committed_state`.
[[ports]]
name = "records_out"
index = 2
direction = "output"
content_type = "OctetStream"

# ── Observability (Phase 14) ──────────────────────────────────────────
# Module-scope counters emitted on `metrics` at a coarse step cadence.
# Declaration order IS the id contract (id N = the Nth name); the emitter
# in module_step passes values in this exact order.
[observability]
metrics = ["applied", "dropped", "untagged", "records", "records_dropped"]
