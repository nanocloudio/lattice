version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# Load-policy recommender.
# Surveys each range's key count and REPORTS what policy permits saying
# about the load. Write rate is the router's per-range write count when
# `signal_in` carries the router's telemetry, else the key count's growth
# (an estimate); range 0's busiest-key share comes from the same
# telemetry. Without it, rate and concentration are reported UNMEASURED,
# never zero. By default it only reports: an advisor acting on its own
# would turn every policy bug into a topology change. With
# `auto_execute = 1` and `exec_out` wired, it emits one split command for
# the operator-declared key the first time policy recommends a split.

# Capacity profiles (docs/architecture/route_catalogue.md "Profiles"):
# `pi5` is the default (unsuffixed) artefact, `rp2350` and `server` the
# others. This module reads no profiled ceiling: its three variants
# build the same code, so a graph names one profile for every module it
# builds.
[[variant]]
name     = "pi5"
features = []
default  = true

[[variant]]
name     = "rp2350"
features = ["profile_rp2350"]

[[variant]]
name     = "server"
features = ["profile_server"]

[[ports]]
name = "kv_in"
direction = "input"
content_type = "OctetStream"

# The router's metrics port: the MEASURED load signal. Optional —
# compositions that omit it leave the advisor on its growth-derived
# lower bound, which still works.
[[ports]]
name = "signal_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# Opt-in: MSG_PLACEMENT_SPLIT_CMD to a range_supervisor (op_kind 4).
# Output index 2; unwired unless the operator opts into auto-execution.
[[ports]]
name = "exec_out"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["surveys", "recommendations", "keys_last_survey"]
