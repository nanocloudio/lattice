version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]
provides         = ["storage.object", "storage.namespace"]
# mod.rs is a SYMLINK to ../kv_state_worker/mod.rs: the same source, built
# with `store_provider`. (A symlink, not an `entry` outside this directory:
# the build's staleness check walks the module's own directory.)
#
# kv_state_worker_store — the state worker that is ALSO fluxor's store: it
# serves the `storage.object` and `storage.namespace` contracts over its own
# store, in the caller's provider call (modules/common/store_provider.rs),
# so a graph whose store is lattice's (nanocloud's control plane) keeps its
# connectors and gains one clock, one history and one store for them and
# for lattice's own surfaces. The role is a DISK worker's (`state_store: 1`:
# a change feed needs the history only the disk provider keeps). A
# single-node worker (`sweep_wrap: 0`) answers a write in the call; one
# replica of a replicated store (`sweep_wrap: 1`, `prov_out` wired to
# consensus, `replica_id` its own) proposes it and answers EINPROGRESS until
# it has applied here, then with a `ReplicatedDurable` fence
# (`group_durable: 1`). Any other configuration registers no contract and
# logs `[kvw] store provider=0 (why)`.
#
# A replica on a node with private records names them (`scope`: the node,
# `scoped`: its prefixes, comma-separated): its graph keeps the plain
# names, the store keeps them under `/~node/<scope>`, so every replica
# holds each node's apart. A LIST, CHANGES or subscription on a scoped
# prefix answers in the graph's names; one on a broader prefix sees the
# store's. A scope it cannot keep registers no contract.
#
# ⚠ TEST-ONLY FAULT INJECTION — never in a shipped graph.
# `fault_read_eagain_every: N` (param 20, default 0 = off) makes one step
# of the store in N BUSY: from that worker step to its next, every read the
# provider is asked (GET, HEAD, RANGE_GET, LIST, CHANGES, an initial-listing
# SUBSCRIBE), by any module, answers EAGAIN with nothing moved — no handle
# opened or closed, no page or fence written. That is the board's store
# while its device is taken by a write, reproduced on Linux, so an E2E
# proves its consumers hold a read that waits (storage.object "Reads: EAGAIN
# means ask again") rather than read it as absent, empty or failed, and
# never re-ask inside a step (the step stays busy: a spinner wedges). Whole
# steps, so every module meets the wait alike and N - 1 steps in N are
# clear. Writes, CLOSE, the fence query and CAPS are never faulted.
# Deterministic (busy steps are the worker's step count modulo N). N = 1 is
# refused (every step busy) and logged. On: `[kvw] FAULT INJECTION ON (test
# only): one store step in N busy, every read EAGAIN, N=<N>` at
# construction, and `fault=<injected>` on `[kvw] store hb`.
# `fault_busy_reaches_store: 1` (param 21) moves a busy step from dispatch
# into the store itself: every store op a read applies answers as the
# worker's store does while its device makes the op wait, so the
# provider's own read paths are what answer EAGAIN.
# `fault_log_hold_steps: N` (param 22, default 0 = off) keeps the log
# pending N worker steps after every single-store write, so another
# caller's write lands between a write and its re-ask (each caller's re-ask
# must still get its own decision).
# tools/ci/no_fault_injection.sh fails CI on any graph outside tests/ that
# sets any of them; see docs/architecture/limit_register.md "Test-only fault
# injection".
#
# A separate module TYPE, not a variant of kv_state_worker: only a graph
# that makes lattice its store carries the provider's heap (the provider,
# its read slots and subscriptions, and a 4 MiB value cache). Ports,
# params and behaviour are kv_state_worker's; see its manifest (below, the
# same).

[[variant]]
name     = "store"
features = ["store_provider"]
default  = true


# Deterministic KPG KV state machine. Owns `revision`,
# `create_revision`, `mod_revision`, `version`, CAS fences,
# compare/then/else evaluation, put/delete/range execution,
# `prev_kv` generation, error-mapping inputs, and snapshot
# import/export of KV records. Lattice's main `session.worker`-class
# core even for short request/response operations because all stable
# state lives here.
#
# State-store provider: the
# `state_store` param selects the physical materialization provider at
# graph construction — 0 = bounded in-memory table (default), 1 = the
# ordered disk provider over the Fluxor FS contract. The `fs` resource
# claim below is a capability GRANT (required for the runtime contract
# gate when `state_store = 1`); it does not force an FS provider into
# memory-only compositions — graphs without one build and run
# unchanged, exactly as durability's volatile variant does.

#
# ⚠ STEP DEADLINE — REQUIRED IN ANY BARE-METAL `state_store = 1` GRAPH.
# With `state_store = 1` this module performs the longest synchronous
# storage action in the graph: the watermark flush writes the WHOLE
# memtable (up to `MEMTABLE_FLUSH_WATERMARK` = 384 records, ~1.7 MB),
# creates a fresh run file, rewrites the manifest and fsyncs — all
# inside ONE `module_step`. It is the one action in `disk_maintenance`
# that is NOT bounded per step.
#
# A module that declares no `step_deadline_us` runs on the kernel
# default of 2000 us (burst 16000 us), and a step timeout under the
# DEFAULT `fault_policy` does not skip the step — `can_restart()` is
# false for anything but `restart`, so the kernel TERMINATES the
# module. One overlong flush and the worker is gone: no heartbeat, no
# command drain, every counter frozen at its pre-flush value. On host
# the flush is a page-cache write and this never fires; on
# FAT32-over-NVMe it is milliseconds to tens of milliseconds.
#
# So any bare-metal disk composition MUST give this module the same
# treatment `durability` already gets for its WAL fsync, e.g.
#
#   - name: kv_state_worker
#     params: { state_store: 1, root_path: 1 }
#     step_deadline_us: 12000
#     step_deadline_burst_us: 16000
#     fault_policy: skip
#
# Note the burst is capped by the config validator at 16 x tick_us, so
# at tick_us = 1000 the values above are the CEILING, not a preference.
# If `ms=` on the end line reaches it, the flush has outgrown what a
# deadline can cover and must be chunked across steps the way `compact`
# already is.
#
# `[kvw] disk flush begin` / `[kvw] disk flush end ok=N ms=M` bracket
# the call: a capture ending on `begin` with no `end` is this fault,
# and `ms=` on a healthy boot is what to size the deadline from.

[[resources]]
requires_contract = "fs"
access = "write"

# Routed commands from kv_request_router (already epoch-validated), and
# the committed clock: MSG_LEASE_TICK arrives on this same channel so
# the time a command applies under is fixed by its position in the
# stream rather than by the applying node's local timer. A graph that
# never delivers a tick leaves the clock at 0, under which no deadline
# has passed and nothing with a TTL ever expires.
[[ports]]
name = "commands"
direction = "input"
content_type = "OctetStream"

# Lin-bound read permit from substrate read_gate.
[[ports]]
name = "read_permit"
direction = "input"
content_type = "OctetStream"

# Quorum durability proof from substrate durability, and the COMMITTED
# MVCC GC floor (`MSG_GC_FLOOR_COMMITTED`)
# once the compaction_coordinator's proposal has been through
# consensus. Envelope type discriminates; a floor record arriving
# anywhere else is ignored, because only a committed one may authorize
# physical reclamation.
[[ports]]
name = "durability"
direction = "input"
content_type = "OctetStream"

# Lease-driven revoke from lease_manager.
[[ports]]
name = "lease_revoke"
direction = "input"
content_type = "OctetStream"

# Reclamation events from ttl_scheduler. Each one releases slots the
# committed clock has already put past their deadline: no revision, no
# tombstone, no watch event, so a replica sweeping earlier or later than
# another cannot make their observable states differ.
[[ports]]
name = "expire"
direction = "input"
content_type = "OctetStream"

# Cluster-wide placement epoch events from substrate
# `control_plane.epoch_events`. MSG_PLACEMENT_EPOCH_EVENT updates
# the worker's notion of the current cluster_epoch; new sessions
# created after a bump observe the advanced epoch. The worker doesn't
# fence ongoing applies (commands carry their own epoch in the
# envelope head and are rejected by the router before they reach
# the worker if stale).
[[ports]]
name = "in_epoch_events"
direction = "input"
content_type = "OctetStream"

# Applied responses to the router.
[[ports]]
name = "responses"
direction = "output"
content_type = "OctetStream"

# Mutation events for watch_registry / watch_fanout.
[[ports]]
name = "mutations"
direction = "output"
content_type = "OctetStream"

# Retention claims to compaction_coordinator: this worker's
# ACTIVE-READ claim (`MSG_RETENTION_CLAIM`), republished on a cadence
# so that going quiet BLOCKS floor advancement instead of permitting it.
[[ports]]
name = "compaction_floor"
direction = "output"
content_type = "OctetStream"

# Snapshot interfaces — substrate durability drives import/export.
[[ports]]
name = "snapshot_import"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "snapshot_export"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# Demand-driven commit-timestamp lease requests to timestamp_allocator
#. Unreplicated HINT — the grant returns replicated,
# in-band on `commands` via the apply bridge. Sent only while the
# worker's lease runs low, so an idle graph proposes nothing.
# MSG_TS_LEASE_REQUEST `[corr_id:u64][requester:u32][size:u32]`
[[ports]]
name = "lease_request"
index = 5
direction = "output"
content_type = "OctetStream"

# KV expiry registrations to ttl_scheduler.
# MSG_TTL_REGISTER `[deadline_ms:u64][key_hash:u64]`, deadline 0 =
# cancel. The deadline comes from the committed clock, so every replica
# publishes the same value from the same log position. It schedules
# reclamation; visibility is decided by the record's own deadline at
# apply time.
[[ports]]
name = "expiry_out"
index = 6
direction = "output"
content_type = "OctetStream"

# Install-complete ack. After a snapshot chunk stream finishes
# installing (a span copy for an elastic split, or any snapshot
# install), the worker emits MSG_APP_SNAPSHOT_INSTALLED
# `[partition_id:u16][applied_index:u64]` here so an orchestrator can
# gate cutover on the span actually being resident. Unwired (index 7 =
# -1) in every graph but the elastic split, so it costs nothing
# elsewhere.
[[ports]]
name = "install_ack_out"
index = 7
direction = "output"
content_type = "OctetStream"

# Chunk sweeps this worker proposes: `KV_OP_CHUNK_SWEEP` commands naming
# the floor it saw commit (the committed GC floor on disk; unbounded on
# the memory store, which keeps no history). Wired back to `commands`
# in a single-node graph (param `sweep_wrap` = command), or to consensus
# (`sweep_wrap` = proposal) so the sweep applies at one log position on
# every replica. Unwired, the store never reclaims a chunk.
[[ports]]
name = "sweep_out"
index = 8
direction = "output"
content_type = "OctetStream"

# The writes this worker's store provider proposes, as one replica of a
# replicated store (`sweep_wrap` = proposal): origin entries
# (`common/origin.rs`) as `MSG_CLIENT_PROPOSAL`s, wired to consensus's
# untagged `proposals` (with `forward_proposals` on, so a follower's
# reach the leader). Every replica applies them by their origin's record,
# so a proposal offered twice applies once. Unwired, a replicated worker
# provides no store.
[[ports]]
name = "prov_out"
index = 9
direction = "output"
content_type = "OctetStream"

# ── Observability ─────────────────────────────────────────────────────
# Module-scope metrics emitted on `metrics` at a ~1 s WALL-CLOCK cadence
# (NOT a step cadence — see the emitter's docs: a step cadence goes
# silent exactly when a step blocks, which is the failure you most need
# to see). Declaration order IS the id contract (id N = the Nth name);
# the emitter in module_step passes values in this exact order.
#
# ids 0-2 are monotonic counters (METRIC_COUNTER). ids 3-13 are the disk
# state-store diagnostic block, added so a wedged worker is readable from
# a `/metrics` scrape when the request path is timing out.
# APPEND ONLY — never renumber, ids are a wire contract.
#
# Counters (METRIC_COUNTER, monotonic):
#   9  disk_flush_attempts   incremented BEFORE the flush call
#   10 disk_flush_completions incremented AFTER it returns Ok
#   11 disk_flush_failures   incremented after it returns a hard Err
#   12 disk_flush_backpressure flush refused (capture/install/compact busy
#                             or run set full) — no I/O was attempted
#   13 disk_cmd_flush_faults in-command `make_room` flush faults
#                             (DiskMaterializer, separate from maintenance)
#   14 disk_fence_aborts     snapshot/install/compaction exclusion fences
#                             force-released by the starvation watchdog.
#                             NON-ZERO IS ALWAYS A BUG UPSTREAM: the store
#                             recovered, but something failed to finish.
#
# `attempts > completions + failures + backpressure` means a flush was
# ENTERED and never returned — the module is blocked inside the FS
# provider. That is the single most diagnostic relation in this block.
#
# Gauges (METRIC_UPDOWN, current state):
#   3 disk_phase        0=RECOVERING 1=SERVING 2=QUARANTINED
#   4 disk_degraded_steps consecutive maintenance steps without progress
#   5 disk_hard_faults  consecutive hard faults (budget: 64 → quarantine)
#   6 disk_last_errno   ABSOLUTE VALUE of the backend's last raw errno,
#                       which is always <= 0. Metrics are unsigned, so the
#                       sign is dropped: 0 = no error, 11 = E_AGAIN (-11),
#                       2 = ENOENT, 5 = EIO, 28 = ENOSPC, 38 = ENOSYS.
#   7 disk_mem_count    memtable occupancy (flush watermark 384 of 512)
#   8 disk_run_count    live run files (compaction trigger at 16)
#  17 cfg_state_store   EFFECTIVE `state_store` param as parsed by the
#                       module (0=memory 1=disk). Report what
#                       was applied, never what the config intended. A
#                       config that says `state_store: 1` while this reads
#                       0 IS the bug. Emitted in BOTH modes.
#  18 cfg_root_path     EFFECTIVE `root_path` param (0=`kv/` subdir,
#                       1=8.3 names at the FS root). Same rule.
#  19 cfg_store_id      EFFECTIVE `store_id` param (0=`kv/`, N=`kvN/`;
#                       multi-range graphs run one worker per range).
#  23 sweeps_proposed   chunk sweeps written to `sweep_out`
#  24 sweeps_applied    chunk sweeps applied (proposed here or by a
#                       replica). Proposed far ahead of applied means
#                       the sweeps never reach the ordering.
[observability]
metrics = [
    "applied",
    "reads",
    "snapshot_chunks",
    "disk_phase",
    "disk_degraded_steps",
    "disk_hard_faults",
    "disk_last_errno",
    "disk_mem_count",
    "disk_run_count",
    "disk_flush_attempts",
    "disk_flush_completions",
    "disk_flush_failures",
    "disk_flush_backpressure",
    "disk_cmd_flush_faults",
    "disk_fence_aborts",
    "gc_floor_commits",
    "gc_claims_published",
    "cfg_state_store",
    "cfg_root_path",
    "cfg_store_id",
    "ts_stamped",
    "ts_unstamped",
    "snapshot_refusals",
    "sweeps_proposed",
    "sweeps_applied",
]
