version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# Optional Memcached UDP datagram anchor. Handles explicit
# source/destination metadata, stateless request/response matching,
# and reroutable datagram service. Disabled by default in graph
# templates (`enabled: false`) per the protocol RFC; flip on in
# memcached-UDP-heavy deployments. `dgram_in`/`dgram_out` carry the
# datagram surface (the net provider's TLV frames, as `NetProto`): wire
# them to `linux_net.net_out`/`net_in`. Replies longer than a datagram
# go out as memcached's numbered multi-datagram response.

[[ports]]
name = "dgram_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "dgram_out"
direction = "output"
content_type = "NetProto"

[[ports]]
name = "routed_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# ── Observability ──────────────────────────────────────────────────────
# Module-scope counters emitted on `metrics` at a coarse step cadence.
# Declaration order IS the id contract (id N = the Nth name); the emitter
# in module_step passes values in this exact order.
[observability]
metrics = ["requests", "forwarded", "errors", "reply_datagrams", "reply_dropped"]
