version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# The egress pump. Reads committed change-feed windows from the KV
# surface (an ordinary anchor-pair client — no privileged read path),
# translates versions into the versioned CDC envelope
# (modules/common/cdc_wire.rs), publishes each event as a METHOD_PUBLISH
# exchange to a `stream.ordered_ack` provider (it is the REQUESTER of the
# fluxor exchange contract), and checkpoints past the contiguous prefix
# answered 200 through the normal KV path (the generation-pointer
# protocol). See modules/common/cdc_feed.rs for the request layout, the
# in-flight window, re-issue after LINK UP and 5xx retry.
#
# One pump instance serves one feed (simpler WCET reasoning; a graph
# adds an instance per feed). Ownership is a static pin: this instance
# is the owner at `owner_epoch`.
#
# Feed lifecycle states, reported on the `state` gauge:
#   0 CREATED  1 BACKFILL  2 STREAMING  3 STALLED  4 NEEDS_BACKFILL
#   5 WEDGED   6 HALTED
#
# Wiring (see configs/single-models-cdc.yaml):
#   kv_out/kv_in      → a free router anchor pair (e.g. etcd_in/out)
#   request_out/response_in → the sink provider's request_in/response_out
#   retention          → compaction_coordinator.claims (budgeted GC
#                        claim; lapse is enforced by the claim EXPIRY,
#                        so release needs no pump cooperation)

# MSG_KV_RESPONSE from the router pair output.
[[ports]]
name = "kv_in"
direction = "input"
content_type = "OctetStream"

# The sink's answers and LINK records.
[[ports]]
name = "response_in"
index = 1
direction = "input"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192

# MSG_KV_REQUEST into the router pair input.
[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

# One METHOD_PUBLISH request record per event. Sized for four worst-case
# records (a full 4 KiB row image, its key, and the request HEAD).
[[ports]]
name = "request_out"
index = 1
direction = "output"
content_type = "ExchangeRequest"
# The consumer half of the capability registry: whatever this edge is wired
# to must declare it provides the surface. A module-level requirement would
# only ask whether SOME module in the graph declares it — this asks the peer
# on this wire, which is what the requirement actually means.
requires_capability = "stream.ordered_ack"
buffer_size = 32768
max_record = 8192

# MSG_RETENTION_CLAIM to compaction_coordinator (GC budget).
[[ports]]
name = "retention"
index = 2
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
index = 3
direction = "output"
content_type = "OctetStream"

# ── Observability ──────────────────────────────────────────────────────
# Declaration order IS the metric-id contract, append-only. `state`,
# `unacked_depth`, `cursor_revision`, `frontier` are level gauges on
# the counter channel (monotone or slow-moving; a regression in
# `cursor_revision` is itself the alarm).
[observability]
metrics = [
    "events_published",
    "events_acked",
    "refusals",
    "replays",
    "checkpoints",
    "resolved_published",
    "backfill_rows",
    "compacted_refusals",
    "state",
    "unacked_depth",
    "cursor_revision",
    "frontier",
]

# What this pump SENDS, against what a sink's backend TAKES. Fact against
# fact: `max_record` above frames a whole record, this is the payload alone.
[capability_facts."stream.ordered_ack"]
max_payload = 8192
