version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# Event framing and replay for active watches. Frames each event
# `watch_registry` matched as a `MSG_WATCH_FRAME` for `etcd_edge_anchor`
# and acks it back to the registry; serves the registry's replay plans
# from the store's history (`KV_OP_SCAN_VERSIONS` through the router),
# re-framing each version as the event it was. Holds no watch table.

# Capacity profiles (docs/architecture/route_catalogue.md "Profiles"):
# `pi5` is the default (unsuffixed) artefact; `rp2350` and `server`
# select the RP2350 and server ceilings of the replay queue and window
# (RP2350 / Pi 5 / server: `MAX_PENDING_PLANS` 4 / 16 / 256,
# `WINDOW_BYTES` and `PREV_BYTES` 16 KiB / 64 KiB / 1 MiB each,
# `WINDOW_FRAMES` 64 / 256 / 4,096). Every module of a graph is built in
# one profile.
[[variant]]
name     = "pi5"
features = []
default  = true

[[variant]]
name     = "rp2350"
features = ["profile_rp2350"]

[[variant]]
name     = "server"
features = ["profile_server"]

# Matched events from watch_registry, one `MSG_WATCH_EVENT` per watch.
[[ports]]
name = "events_in"
direction = "input"
content_type = "OctetStream"

# Replay plan from watch_registry on rebind.
[[ports]]
name = "replay_plan"
direction = "input"
content_type = "OctetStream"

# Framed watch responses out to etcd_edge_anchor.
[[ports]]
name = "frames_out"
direction = "output"
content_type = "OctetStream"

# Progress ack back to watch_registry.
[[ports]]
name = "progress"
direction = "output"
content_type = "OctetStream"

# Backfill reads out to kv_request_router. On a MSG_WATCH_REPLAY_PLAN
# the fanout issues MSG_KV_REQUEST envelopes carrying
# KV_OP_SCAN_VERSIONS over the plan's key span and revision window, and
# turns each returned version into the same MSG_WATCH_FRAME a live
# event would have produced. Unwired in graphs without a durable
# history provider: the fanout then refuses each plan as COMPACTED (the
# client relists) rather than pretending it replayed.
[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

# MSG_KV_RESPONSE envelopes back from kv_request_router carrying
# KV_RESULT_VERSIONS pages.
[[ports]]
name = "kv_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# ── Observability ─────────────────────────────────────────────────────
# Module-scope counters emitted on `metrics` at a coarse step cadence.
# Declaration order IS the id contract (id N = the Nth name); the emitter
# in module_step passes values in this exact order.
[observability]
metrics = ["events", "delivered", "dropped", "replayed", "replays_unserviceable"]
