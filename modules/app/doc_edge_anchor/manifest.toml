version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# The MongoDB dialect of the document model. A MongoDB driver
# connects on 27017; this module frames
# OP_MSG and translates commands, BSON, queries, updates and projections
# into canonical document operations (MSG_DOC_REQUEST) for
# document_executor, and renders its answers. It holds no document
# semantics and touches no KV key: the executor does both, for every
# dialect alike.

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"

# MSG_DOC_RESPONSE from document_executor.dialect_out.
[[ports]]
name = "exec_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"

# MSG_DOC_REQUEST to document_executor.dialect_in.
[[ports]]
name = "exec_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["sessions", "commands", "docs_written", "docs_returned", "errors"]
