version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# Cross-range transaction coordinator (RFC database foundation §13,
# Phase 5).
#
# Drives ONE declared cross-range transaction through §13.2 using the
# decision machine in modules/common/txn_coordinator.rs and the
# participant ops TXN_PREPARE / TXN_RESOLVE / TXN_RECORD. Every send is
# addressed to a named partition through KV_OP_TARGETED, because the
# routing map deliberately refuses to route one op to two ranges.
#
# The manual execution gate, same as range_supervisor's: the
# transaction is DECLARED in the graph config and starts
# `start_delay_ms` after boot. mode 0 is inert and costs nothing.
#
# Does NOT help: a reader that gets KV_RESULT_TXN_PENDING for a
# transaction whose coordinator died has nowhere to turn yet.

# Replies from kv_request_router.internal_lifecycle_out.
[[ports]]
name = "kv_in"
direction = "input"
content_type = "OctetStream"

# MSG_KV_REQUEST to kv_request_router.internal_lifecycle_in — the only
# ingress allowed to carry KV_OP_TARGETED.
[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
#   0 phase      1 Pending, 2 Staging, 3 Committed, 4 Aborted, 9 done
#   1 committed  transactions that reached a durable commit
#   2 aborted    transactions that reached a durable abort
#   3 errors     refused sends, faults, and record write refusals
metrics = ["phase", "committed", "aborted", "errors"]
