version          = "0.1.0"
type             = "Protocol"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]
timer_class      = "wall_clock"

[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

# Reserved for post-auth commands; auth needs no input.
[[ports]]
name         = "publish_in"
index        = 1
direction    = "input"
content_type = "OctetStream"
buffer_size  = 2048

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

# Auth/ping result status.
[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "TextPlain"
buffer_size  = 2048

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
exempt = "MongoDB connector; throughput is observed at the network provider"
