version          = "0.1.0"
type             = "Protocol"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]
timer_class      = "wall_clock"

# A provider of the exchange contract: each request's body is one SQL
# simple query, answered once with its result set (see mod.rs for the
# request and answer layouts byte for byte).

# NetProto pair to the network provider (ip on embedded, linux_net on linux).
[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

[[ports]]
name         = "request_in"
index        = 1
direction    = "input"
content_type = "ExchangeRequest"
buffer_size  = 16384
max_record   = 8192

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

[[ports]]
name         = "response_out"
index        = 1
direction    = "output"
content_type = "ExchangeResponse"
buffer_size  = 16384
max_record   = 8192

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
exempt = "Postgres connector; throughput is observed at the network provider"
