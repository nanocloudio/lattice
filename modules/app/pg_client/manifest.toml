version          = "0.1.0"
type             = "Protocol"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]
timer_class      = "wall_clock"

# NetProto pair to the network provider (ip on embedded, linux_net on linux).
[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

# SQL query text (a simple-query string).
[[ports]]
name         = "request_in"
index        = 1
direction    = "input"
content_type = "TextPlain"
buffer_size  = 4096

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

# The first column of the first result row.
[[ports]]
name         = "reply_out"
index        = 1
direction    = "output"
content_type = "TextPlain"
buffer_size  = 4096

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
exempt = "Postgres connector; throughput is observed at the network provider"
