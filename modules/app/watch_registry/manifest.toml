version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# Durable watch state owner and SessionCtrlV1 session worker. Maintains
# `WatchID -> WatchRecord{key_range, start_revision, filters,
# progress_notify, last_sent_revision, binding{session_id, anchor_id,
# session_epoch}, phase, delivery cursors}`. Answers Fluxor's session
# control plane (attach / detach / drain / export / resume) for every
# watch it fronts, plans replay when a session (re)enters service, and
# validates epochs per session rather than in cluster lockstep.

# Continuity role: a movable session worker that survives a handoff.
capabilities = ["session.worker", "session.handoff", "session.resume"]

[capability_facts."session.resume"]
scope = "fleet"

# Params (TLV, parsed by the module via define_params!):
#   worker_id  tag 1, u8, default 0 — which of the anchor's workers this
#              instance is (0 = the one new sessions attach to, 1 = a
#              standby). A single-registry graph leaves it at 0.

# Capacity profiles (docs/architecture/route_catalogue.md "Profiles"):
# `pi5` is the default (unsuffixed) artefact; `rp2350` and `server`
# select the RP2350 and server ceilings of `watch_hub::MAX_WATCHES`
# (RP2350 / Pi 5 / server: 64 / 1,024 / 8,192 watches; ~25 KiB,
# ~392 KiB, ~3.1 MiB of records). Every module of a graph is built in
# one profile.
[[variant]]
name     = "pi5"
features = []
default  = true

[[variant]]
name     = "rp2350"
features = ["profile_rp2350"]

[[variant]]
name     = "server"
features = ["profile_server"]

[[ports]]
# `ctrl_in` (not `ctrl`) because bare `ctrl` is a fluxor-reserved
# port name (it collides with the kernel-allocated control channel
# passed to every module's `module_new`). Carries both SessionCtrlV1
# frames (0x70..0x9F) and the data-plane `MSG_WATCH_CTRL` envelopes
# from the etcd anchor.
name = "ctrl_in"
direction = "input"
content_type = "OctetStream"

# Committed mutation events from kv_state_worker (filter + dispatch).
[[ports]]
name = "mutations"
direction = "input"
content_type = "OctetStream"

# `MSG_WATCH_PROGRESS` acks from watch_fanout: one per framed event
# (the delivery cursor and acked revision advance together), plus the
# compaction-refusal ack that ends a watch.
[[ports]]
name = "progress"
direction = "input"
content_type = "OctetStream"

# Cluster-wide placement epoch events from substrate
# `control_plane.epoch_events`. Held on the hub; never stamped into a
# session. Optional — single-node
# graphs that don't wire `control_plane` leave this unwired.
[[ports]]
name = "in_epoch_events"
direction = "input"
content_type = "OctetStream"

# SessionCtrlV1 replies (MSG_SC_*) back to the etcd anchor. This is the
# module's first output, so `module_new` binds it from `out_chan`.
[[ports]]
name = "ctrl_out"
direction = "output"
content_type = "OctetStream"

# Replay plan emitted to fanout when a session (re)enters service.
[[ports]]
name = "replay_plan"
direction = "output"
content_type = "OctetStream"

# Retention floor declarations to compaction_coordinator.
[[ports]]
name = "retention"
direction = "output"
content_type = "OctetStream"

# Forwarded events to fanout.
[[ports]]
name = "events_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# ── Observability ────────────────────────────────────────────────────
# Module-scope counters emitted on `metrics` at a coarse step cadence.
# Declaration order IS the id contract (id N = the Nth name); the emitter
# in module_step passes values in this exact order.
[observability]
# APPEND ONLY — ids are a wire contract.
#   2 resyncs  watches ended with a COMPACTED frame the registry wrote
#              itself (the client relists): one mutation matched more
#              watches than the match-batch budget reaches, a replay plan
#              or tail catch-up found no room on its channel, or a define
#              the hub would not hold.
metrics = ["registered", "cancelled", "resyncs"]
