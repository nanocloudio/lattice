version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# The shared relational execution engine (RFC database foundation §14.2,
# §14.5). Compiles typed relational operations into bounded Lattice KV
# reads, ordered scans, and writes.
#
# One executor serves BOTH connectors. §14.2 makes the intermediate
# representation, the catalogs, name resolution, binding, planning and
# execution shared modules rather than per-connector ones, and §14.3
# forbids a connector from introducing its own table format or catalog of
# record. Two executors would satisfy the letter of that and break its
# intent: they would eventually disagree about what a statement means for
# a given schema, and nothing would surface the disagreement.
#
# Owns:
#   - statement parse + bind (via modules/common/sql_core.rs)
#   - the relational catalog: table descriptors and the name index
#   - table-id allocation
#   - row and primary-key encoding (via modules/common/relational.rs)
#   - the per-statement execution state machine, one KV round trip per
#     cooperative step
#
# Does NOT own:
#   - wire protocol, authentication, session variables, error-code
#     mapping, or result FORMATTING — all connector concerns per §14.3
#   - durability. Every write leaves here as a KV request and acquires
#     its durability from the same Raft + WAL path a Redis SET takes.

# Statements in from pg_edge_anchor.
[[ports]]
name = "pg_in"
direction = "input"
content_type = "OctetStream"

# Statements in from mysql_edge_anchor.
[[ports]]
name = "mysql_in"
direction = "input"
content_type = "OctetStream"

# MSG_KV_RESPONSE pages back from kv_request_router.
[[ports]]
name = "kv_in"
direction = "input"
content_type = "OctetStream"

# MSG_TXN_SUBMIT_RESULT from txn_coordinator (cross-range 2PC outcome).
# Input index 3; wired only in a two-range relational graph. Where it is
# unwired a cross-range batch is refused rather than coordinated.
[[ports]]
name = "txn_result_in"
direction = "input"
content_type = "OctetStream"

# Results out to pg_edge_anchor.
[[ports]]
name = "pg_out"
direction = "output"
content_type = "OctetStream"

# Results out to mysql_edge_anchor.
[[ports]]
name = "mysql_out"
direction = "output"
content_type = "OctetStream"

# MSG_KV_REQUEST out to kv_request_router.internal_sql_in, stamped
# PROTO_INTERNAL_SQL so replies come back on this module's own port pair
# rather than a client protocol's.
[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# MSG_TXN_SUBMIT to txn_coordinator.submit_in when a batch spans ranges.
# Output index 4; wired only in a two-range relational graph.
[[ports]]
name = "txn_submit_out"
direction = "output"
content_type = "OctetStream"

# ── Observability (Phase 14) ──────────────────────────────────────────
# Module-scope counters emitted on `metrics` at a coarse step cadence.
# Declaration order IS the id contract (id N = the Nth name). Ids 0-4 are
# counters emitted on the `metrics` port in this exact order; ids 5+ ride
# the kernel telemetry ring only (the id is still the position here).
[observability]
# ids are positional and append-only. 7 is the query-latency histogram
# (`LAT_HIST_RING_ID` in mod.rs pins the position — count before
# reordering).
metrics = [
    "statements",
    "rows_returned",
    "rows_written",
    "errors",
    "queue_rejects",
    "stale_name_retries",
    "stmt_timeouts",
    "query_latency_us",
]

# Bounds MUST match `LAT_BOUNDS_US` in mod.rs — the id-table ships the
# declaration to consumers; the record carries counts only. The dimension is
# the statement's operation kind; session-control statements are untimed by
# design (protocol chatter, not queries), and a raw statement text or hash is
# deliberately NOT a dimension — unbounded label values are forbidden.
[[observability.instrument]]
name      = "query_latency_us"
kind      = "histogram16"
bounds_us = [50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000,
             100000, 250000, 500000, 1000000, 2500000]

[[observability.instrument.dimension]]
key    = "db.operation.name"
domain = "enum"
values = ["select", "insert", "update", "delete", "ddl"]
