version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# Graph, search, and vector capabilities over one RESP surface.
# Three SEPARATE semantic sets compiled into three model keyspaces;
# nothing shared between them but byte foundations. GRAPH.EDGE writes
# BOTH adjacency postings in one transaction; SEARCH.INDEX writes
# every posting in one transaction; VECTOR.SIM is EXACT k-nearest
# (squared L2) and its reply says so — label honesty on the wire.
#
# Router pairing: POSITIONAL pair #2 ("memcached_*" names) stamped
# PROTO_MEMCACHED — all sixteen router outputs are allocated and a
# model composition has no memcached anchor.

# Capacity profiles (docs/architecture/route_catalogue.md "Profiles"):
# `pi5` is the default (unsuffixed) artefact, `rp2350` and `server` the
# others. This module reads no profiled ceiling: its three variants
# build the same code, so a graph names one profile for every module it
# builds.
[[variant]]
name     = "pi5"
features = []
default  = true

[[variant]]
name     = "rp2350"
features = ["profile_rp2350"]

[[variant]]
name     = "server"
features = ["profile_server"]

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"

[[ports]]
name = "kv_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "kv_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["sessions", "commands", "errors"]
